<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b1530">
<title>Atlantic Coast Tours</title>
<meta name="description" content="Ask anything about our tours on the Wild Atlantic Way. Answers come live from our tour sheet.">
<meta property="og:title" content="Atlantic Coast Tours: ask about our tours">
<meta property="og:description" content="Prices, slots this week and special offers, answered live from our tour sheet.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1530'/%3E%3Cpath d='M10 42c8-8 14-8 22 0s14 8 22 0' stroke='%23d9b46a' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M18 30 30 14l14 16' stroke='%23f3ead8' stroke-width='4' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1530;--navy2:#14244d;--ink:#f3ead8;--muted:#9aa6c0;--gold:#d9b46a;--line:rgba(255,255,255,.09);--glass:rgba(255,255,255,.055)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#070e22;color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto;
  background:radial-gradient(900px 420px at 85% -10%,#2a3f78 0,transparent 60%),linear-gradient(180deg,var(--navy) 0,#070e22 70%)}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.logo{width:40px;height:40px;border-radius:12px;flex:none;background:var(--navy2);border:1px solid rgba(217,180,106,.35);display:grid;place-items:center}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font:500 19px/1.15 Fraunces,Georgia,serif}
.brand h1 em{color:var(--gold)}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:#5fd38d;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,211,141,.6)}70%{box-shadow:0 0 0 7px rgba(95,211,141,0)}100%{box-shadow:0 0 0 0 rgba(95,211,141,0)}}
.icon-btn{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);display:grid;place-items:center;cursor:pointer;text-decoration:none}
.icon-btn:active{transform:scale(.94)}
.icon-btn.spin svg{animation:spin .8s linear}
@keyframes spin{to{transform:rotate(360deg)}}

main{flex:1;overflow-y:auto;padding:20px 16px 8px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;overscroll-behavior:contain}
.hero{text-align:center;padding:18px 8px 10px}
.hero h2{font:500 clamp(30px,8vw,44px)/1.05 Fraunces,Georgia,serif;margin:0 0 8px}
.hero h2 em{color:var(--gold)}
.hero p{color:var(--muted);margin:0;font-size:15px}
.row{display:flex;gap:8px;align-items:flex-end;animation:in .28s ease-out both}
.row.me{justify-content:flex-end}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.av{width:28px;height:28px;border-radius:50%;flex:none;background:var(--navy2);border:1px solid rgba(217,180,106,.35);display:grid;place-items:center;font:500 13px Fraunces,serif;color:var(--gold)}
.msg{max-width:min(82%,560px);padding:10px 14px;border-radius:20px;white-space:pre-wrap;word-wrap:break-word;font-size:15.5px}
.bot .msg{background:var(--navy2);border:1px solid var(--line);border-bottom-left-radius:6px}
.me .msg{background:linear-gradient(135deg,#e6c47c,#cfa553);color:#1a1405;border-bottom-right-radius:6px}
.msg b{color:var(--gold);font-weight:600}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.4}}

.dock{padding:8px 0 calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(7,14,34,.85);backdrop-filter:blur(14px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;background:var(--glass);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;font:14px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.chips button:active{border-color:var(--gold);transform:scale(.97)}
form{display:flex;gap:8px;align-items:center;margin:0 16px;padding:5px 5px 5px 16px;background:#0f1a3a;border:1px solid var(--line);border-radius:999px;transition:border-color .2s}
form:focus-within{border-color:var(--gold)}
input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:16px Inter,sans-serif;outline:none;padding:9px 0}
input::placeholder{color:#6f7b96}
#send{width:42px;height:42px;flex:none;border-radius:50%;border:0;background:var(--gold);color:#1a1405;display:grid;place-items:center;cursor:pointer;transition:transform .15s,opacity .2s}
#send:active{transform:scale(.92)}
#send:disabled{opacity:.4}
@media (min-width:761px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><svg width="24" height="24" viewBox="0 0 64 64"><path d="M8 44c8-8 14-8 24 0s16 8 24 0" stroke="#d9b46a" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M18 32 31 14l15 18" stroke="#f3ead8" stroke-width="5" fill="none" stroke-linejoin="round"/></svg></div>
    <div class="brand">
      <h1>Atlantic <em>Coast</em> Tours</h1>
      <div class="live"><span class="dot"></span><span id="liveText">Connecting to tour sheet...</span></div>
    </div>
    <button class="icon-btn" id="refresh" type="button" aria-label="Refresh live data"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg></button>
    <a class="icon-btn" href="https://docs.google.com/spreadsheets/d/1balBGf8QhZ5dc-RCCAPt2kcrcf6m_YRh0HL_r8bBtJw/edit?gid=120683740" target="_blank" rel="noopener" aria-label="Open the live sheet"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/></svg></a>
  </header>

  <main id="chat" aria-live="polite">
    <div class="hero"><h2><em>Ask</em> about our tours.</h2><p>Prices, slots this week and offers across Clare, Galway and Mayo.</p></div>
  </main>

  <div class="dock">
    <div class="chips" id="chips">
      <button>What's cheapest this week?</button>
      <button>Which tours have offers?</button>
      <button>Family friendly in Mayo?</button>
      <button>Kilkee sea caves available?</button>
      <button>Best kayak trip?</button>
    </div>
    <form id="form"><input id="q" placeholder="Ask about a tour, price or slot" autocomplete="off" enterkeyhint="send" maxlength="500">
      <button id="send" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></form>
  </div>
</div>
<script>
const API = "https://atlantic-tours-bot.victordelrosal.workers.dev";
const chat = document.getElementById("chat"), form = document.getElementById("form"), q = document.getElementById("q"), send = document.getElementById("send");
const history = [];

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
function row(role, html){
  const r=document.createElement("div");r.className="row "+(role==="user"?"me":"bot");
  r.innerHTML=(role==="user"?"":'<div class="av">A</div>')+'<div class="msg">'+html+'</div>';
  chat.appendChild(r);chat.scrollTop=chat.scrollHeight;return r;
}
function add(role,text){return row(role,fmt(text))}

add("assistant","Hello! I'm the Atlantic Coast Tours assistant. Ask me about any tour: prices, slots left this week, offers or where to meet.");

async function loadLive(){
  const t=document.getElementById("liveText"),b=document.getElementById("refresh");
  b.classList.remove("spin");void b.offsetWidth;b.classList.add("spin");
  try{const r=await fetch(API+"/tours");const d=await r.json();
    const open=d.tours.filter(x=>+x.slots_this_week>0).length;
    t.textContent=`Live · ${d.tours.length} tours · ${open} open · ${new Date(d.fetchedAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}`;
  }catch(e){t.textContent="Live sheet unavailable right now"}
}
document.getElementById("refresh").onclick=loadLive;
loadLive();

async function ask(text){
  text=text.trim(); if(!text) return;
  const hero=chat.querySelector(".hero"); if(hero) hero.remove();
  add("user",text); history.push({role:"user",content:text});
  q.value=""; send.disabled=true;
  const typing=row("assistant","");typing.querySelector(".msg").className="msg typing";typing.querySelector(".msg").innerHTML="<span></span><span></span><span></span>";
  try{
    const r=await fetch(API+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});
    const d=await r.json(); typing.remove();
    const reply=d.reply||("Sorry, something went wrong: "+(d.error||"no reply"));
    add("assistant",reply); if(d.reply) history.push({role:"assistant",content:reply}); else history.pop();
    loadLive();
  }catch(e){typing.remove();add("assistant","Sorry, I couldn't reach the tour desk. Please try again.");history.pop()}
  send.disabled=false;
}
form.onsubmit=e=>{e.preventDefault();ask(q.value)};
document.querySelectorAll("#chips button").forEach(b=>b.onclick=()=>ask(b.textContent));
</script>
</body>
</html>
