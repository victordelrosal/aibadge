<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>One moment</title>
<!-- ---------------------------------------------------------------
     THE BRIDGE (1 Oct 2026, Victor: "if you're logged in for the AI Badge you are logged
     in for Reckoning"). AI Badge and aireckon.ing sign into the same Firebase project, so
     a person is the same account on both, but each site keeps its own sign-in and no
     cookie can cross between two domains. aireckon.ing sends a reader here; if this
     browser is signed in to AI Badge, the page hands that account's ID token back to
     aireckon.ing in the address fragment (never sent to any server on the way), where the
     deck checks its own state value and the server verifies the token as usual.

     It will only return to aireckon.ing, and only to a deck path. Anything else gets a plain message and no token.
     --------------------------------------------------------------- -->
<style>
  html,body{margin:0;height:100%;background:#05061c;color:#F2EFE6;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  main{height:100%;display:grid;place-items:center;text-align:center;padding:16px}
  .mk{width:44px;height:44px;margin:0 auto 18px;border-radius:50%;
    background:radial-gradient(circle at 34% 32%,#ffe9b0,#E3C878 42%,#a9761f 70%,#3a2a08 100%);
    animation:b 1.6s ease-in-out infinite}
  @keyframes b{50%{box-shadow:0 0 30px rgba(227,200,120,.5)}}
  p{margin:0;color:#9aa3b8}
  @media (prefers-reduced-motion: reduce){ .mk{animation:none} }
</style>
</head>
<body>
<main><div><div class="mk"></div><p id="msg">Checking your AI Badge sign-in…</p></div></main>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="assets/js/firebase-app.js"></script>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var state = q.get('state') || '';
  var ret = null;
  try { ret = new URL(q.get('return') || ''); } catch (_) {}

  /* aireckon.ing only: a preview address of the Pages project is anyone's branch (verifier, 1 Oct). */
  var okOrigin = ret && ret.origin === 'https://aireckon.ing';
  var okPath = ret && /^\/p(\/|$)/.test(ret.pathname);
  if (!okOrigin || !okPath || !/^[A-Za-z0-9]{8,64}$/.test(state)) {
    document.getElementById('msg').textContent = 'This link cannot be used. Go back to the deck and sign in there.';
    return;
  }

  function hand(token) {
    ret.hash = 'rkb=' + encodeURIComponent(token) + '&st=' + state;
    location.replace(ret.toString());
  }

  firebase.initializeApp(firebaseConfig);   // AI Badge's own config (assets/js/firebase-app.js)

  var done = false;
  var timer = setTimeout(function () { if (!done) { done = true; hand('none'); } }, 6000);
  firebase.auth().onAuthStateChanged(function (user) {
    if (done) return;
    done = true; clearTimeout(timer);
    if (!user) return hand('none');
    document.getElementById('msg').textContent = 'Taking you back to The AI Reckoning…';
    user.getIdToken().then(hand, function () { hand('none'); });
  });
})();
</script>
</body>
</html>
